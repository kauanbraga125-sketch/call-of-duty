name: PS4 - Prototipo Nativo 0.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'ps4/prototype/**'
      - '.github/workflows/ps4-prototype.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verificar gerador de icone sem dependencias
        run: |
          python3 ps4/prototype/tools/make_icon.py /tmp/cod1ps4-icon.png
          file /tmp/cod1ps4-icon.png
      - name: Baixar SDK OpenOrbis oficial v0.5.4 (LLVM 18)
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 5 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o /tmp/ps4-sdk.tar.gz
          mkdir -p openorbis-sdk
          tar -xzf /tmp/ps4-sdk.tar.gz -C openorbis-sdk --strip-components=2
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/openorbis-sdk" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/openorbis-sdk/bin/linux" >> "$GITHUB_PATH"
          ls -l openorbis-sdk/bin/linux openorbis-sdk/lib/crt1.o
          sudo apt-get update -qq
          sudo apt-get install -y -qq lld-18
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          clang++ --version
          ld.lld --version
      - name: Compatibilidade OpenSSL 1.1 apenas no empacotador legado
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 5 \
            https://security.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb \
            -o /tmp/libssl11.deb
          mkdir -p /tmp/codps4-ssl11
          dpkg-deb -x /tmp/libssl11.deb /tmp/codps4-ssl11
          echo "LD_LIBRARY_PATH=/tmp/codps4-ssl11/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Compilar EBOOT e empacotar PKG
        working-directory: ps4/prototype
        shell: bash
        run: |
          set -euxo pipefail
          make
          test -s IV0000-CODP40001_00-COD1PS4PROTOTYPE.pkg
      - name: Publicar PKG experimental
        uses: actions/upload-artifact@v4
        with:
          name: cod1-ps4-boot-v0.1-experimental
          path: ps4/prototype/*.pkg
          if-no-files-found: error
          retention-days: 14
